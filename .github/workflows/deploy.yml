name: Deploy Saanj
# Publishes the site and Firestore rules to Firebase on every push to main.
on:
  push:
    branches: [main]
    paths: ['web/**', 'firestore.rules', 'firebase.json', '.firebaserc', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy hosting and rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting,firestore:rules --project saanj-a27ee --non-interactive
